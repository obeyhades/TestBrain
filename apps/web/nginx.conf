server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The browser only ever talks to this one origin. That is why the session
    # cookie is first-party and there is no CORS configuration anywhere.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page app: every unknown path is handed to index.html so the router
    # can take it from there. Without this, reloading /projects/123 would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
